{% metadata_file .yamato/coverage_tests.metafile %}
test_editors:
    - version: 6000.0
      testProject: Project
      enableNoDefaultPackages: !!bool true
    - version: 6000.0
      testProject: DevProject
      enableNoDefaultPackages: !!bool true

trunk_editor:
    - version: 6000.6
      testProject: DevProject

test_platforms:
    - name: win
      type: Unity::VM
      image: package-ci/win11:v4
      flavor: b1.large
    - name: mac
      type: Unity::VM::osx
      image: package-ci/macos-14-arm64:default
      flavor: m1.mac
      model: M1
      arch: arm64
    - name: linux
      type: Unity::VM
      image: package-ci/ubuntu-22.04:v4
      flavor: b1.large

packages:
    - name: com.unity.ml-agents
      assembly: Unity.ML-Agents
      minCoveragePct: 72
---

all_package_tests:
    name: Run All Combinations of Editors/Platforms Tests
    dependencies:
        {% for coverage_editor in coverage_test_editors %}
        {% for coverage_platform in coverage_test_platforms %}
        {% for coverage_package in coverage_test_packages %}
        - .yamato/com.unity.ml-agents-coverage.yml#test_coverage_{{ coverage_package.name }}_{{ coverage_platform.name }}_{{ coverage_editor.version }}_{{ coverage_editor.testProject }}
        {% endfor %}
        {% endfor %}
        {% endfor %}
        {% for editor in test_editors %}
        {% for platform in test_platforms %}
        - .yamato/com.unity.ml-agents-test.yml#test_com.unity.ml-agents_{{ platform.name }}_{{ editor.version }}_{{ editor.testProject }}
        {% endfor %}
        {% endfor %}
        {% for editor in trunk_editor %}
        {% for platform in test_platforms %}
        - .yamato/com.unity.ml-agents-test.yml#test_com.unity.ml-agents_{{ platform.name }}_{{ editor.version }}_{{ editor.testProject }}
        {% endfor %}
        {% endfor %}
    triggers:
        cancel_old_ci: true
        recurring:
            - branch: develop
              frequency: daily

  {% for package in packages %}
  {% for editor in test_editors %}
  {% for platform in test_platforms %}

  {% if editor.enableNoDefaultPackages %}
  {% assign noDefaultPackagesOptions = "--extra-create-project-arg='-upmNoDefaultPackages'" %}
  {% else %}
  {% assign noDefaultPackagesOptions = "" %}
  {% endif %}

test_{{ package.name }}_{{ platform.name }}_{{ editor.version }}_{{ editor.testProject }}:
    name : {{ package.name }} test {{ editor.version }} on {{ platform.name }} in {{ editor.testProject }}
    agent:
        type: {{ platform.type }}
        image: {{ platform.image }}
        flavor: {{ platform.flavor}}
{% if platform.model -%}
        model: {{ platform.model }}
{% endif -%}
    commands:
        - npm install upm-ci-utils@stable -g --registry https://artifactory.prd.cds.internal.unity3d.com/artifactory/api/npm/upm-npm
        - upm-ci package test -u {{ editor.version }} --package-path {{ package.name }} {{ noDefaultPackagesOptions }} --warnings-as-errors --extra-utr-arg "reruncount=2"
    artifacts:
        logs:
            paths:
                - "upm-ci~/test-results/**/*"
    dependencies:
        - .yamato/com.unity.ml-agents-pack.yml#pack
        {% for coverage_editor in coverage_test_editors %}
        {% for coverage_platform in coverage_test_platforms %}
        {% for coverage_package in coverage_test_packages %}
        - .yamato/com.unity.ml-agents-coverage.yml#test_coverage_{{ coverage_package.name }}_{{ coverage_platform.name }}_{{ coverage_editor.version }}_{{ coverage_editor.testProject }}
        {% endfor %}
        {% endfor %}
        {% endfor %}
    triggers:
        cancel_old_ci: true
      {% if platform.name == "linux" %}
        expression: |
            (pull_request.target eq "main" OR
            pull_request.target eq "develop" OR
            pull_request.target match "release.+") AND
            NOT pull_request.draft AND
            (pull_request.changes.any match "com.unity.ml-agents/**" OR
             pull_request.changes.any match " {{ editor.testProject }}/**" OR
            pull_request.changes.any match ".yamato/com.unity.ml-agents-test.yml")
      {% endif %}
      {% endfor %}
  {% endfor %}
  {% endfor %}

  {% for package in packages %}
  {% for editor in trunk_editor %}
  {% for platform in test_platforms %}

test_{{ package.name }}_{{ platform.name }}_{{ editor.version}}_{{ editor.testProject }}:
    name : {{ package.name }} test {{ editor.version }} on {{ platform.name }} in {{ editor.testProject }}
    agent:
        type: {{ platform.type }}
        image: {{ platform.image }}
        flavor: {{ platform.flavor}}
{% if platform.model -%}
        model: {{ platform.model }}
{% endif -%}
    commands:
        - unity-downloader-cli -u {{ editor.version }} -c editor --wait --fast {% if platform.arch %}-a {{ platform.arch }}{% endif %}
        - UnifiedTestRunner --suite=editor --suite=playmode --editor-location=.Editor --testproject={{ editor.testProject }} --artifacts-path=upm-ci~/test-results --reruncount=2
    artifacts:
        logs:
            paths:
                - "upm-ci~/test-results/**/*"
    dependencies:
        - .yamato/com.unity.ml-agents-pack.yml#pack
        {% for coverage_editor in coverage_test_editors %}
        {% for coverage_platform in coverage_test_platforms %}
        {% for coverage_package in coverage_test_packages %}
        - .yamato/com.unity.ml-agents-coverage.yml#test_coverage_{{ coverage_package.name }}_{{ coverage_platform.name }}_{{ coverage_editor.version }}_{{ coverage_editor.testProject }}
        {% endfor %}
        {% endfor %}
        {% endfor %}
    triggers:
        cancel_old_ci: true
      {% endfor %}
  {% endfor %}
  {% endfor %}
